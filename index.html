<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="description" content="Orders, customers, khata and WhatsApp campaigns for your restaurant." />
    <title>Restora</title>

    <!-- Icons: made by brand/build.mjs. The web app manifest is added by vite-plugin-pwa (vite.config.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Added to an iPhone or Android home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Restora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (WhatsApp, Facebook, X, LinkedIn). og:image needs the full address: set VITE_APP_URL in .env. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Restora" />
    <meta property="og:title" content="Restora: the restaurant CRM" />
    <meta property="og:description" content="Orders, customers, khata and WhatsApp campaigns for your restaurant." />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Restora logo: Orders, customers, khata and WhatsApp campaigns for your restaurant." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The restaurant's appearance as this device saved it last (utils/apply_appearance), set before anything paints, so a
         dark or themed restaurant never flashes the default colours. -->
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('restora-appearance') || '{}');
        var r = document.documentElement;
        r.dataset.theme = a.theme || 'indigo';
        r.dataset.mode = a.mode === 'dark' || (a.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        r.dataset.sidebar = a.sidebar || 'plain';
      } catch (e) {}
    </script>

    <!-- The boot screen below, shown until the app has downloaded. Colors are the canvas and primary tokens of src/index.css;
         the lid lifts and settles. It fades in late, so a fast load never flashes it. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #F6F7F9; animation: boot-in 300ms 400ms both; }
      [data-mode='dark'] .boot { background: #0B0F19; }
      .boot-lid { transform-box: fill-box; transform-origin: 100% 100%; animation: boot-lid 1.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-lid { 0%, 55%, 100% { transform: none; } 25% { transform: translateY(-2px) rotate(12deg); } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot-lid { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Restora">
        <svg viewBox="0 0 40 40" width="112" height="112" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="#4F46E5" />
          <g fill="#FFFFFF">
            <g class="boot-lid"><circle cx="20" cy="9.5" r="2.5" /><path d="M9 23a11 11 0 0 1 22 0z" /></g>
            <rect x="7" y="25" width="26" height="4" rx="2" />
            <path d="M10.5 28h5L10 32.5z" />
          </g>
        </svg>
      </div>
    </div>
    <noscript>Restora needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
