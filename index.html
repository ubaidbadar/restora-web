<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="description" content="Orders, customers, khata and WhatsApp campaigns for your restaurant." />
    <title>Restora</title>

    <!-- Icons: made by brand/build.mjs. The web app manifest is added by vite-plugin-pwa (vite.config.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Added to an iPhone or Android home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Restora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (WhatsApp, Facebook, X, LinkedIn). og:image needs the full address: set VITE_APP_URL in .env. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Restora" />
    <meta property="og:title" content="Restora: the restaurant CRM" />
    <meta property="og:description" content="Orders, customers, khata and WhatsApp campaigns for your restaurant." />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Restora logo: Orders, customers, khata and WhatsApp campaigns for your restaurant." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Desktop /index.html boot diagnostics. On a normal hosted web route this is inactive. -->
    <script>
      (() => {
        if (location.origin !== 'https://app.restora.live' || location.pathname !== '/index.html') return;
        const problems = [];
        window.addEventListener('error', (event) => {
          const resource = event.target && (event.target.src || event.target.href);
          problems.push(resource ? 'Failed to load: ' + resource : (event.message || 'JavaScript startup error'));
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          problems.push('Startup promise: ' + String(event.reason).slice(0, 200));
        });
        document.addEventListener('DOMContentLoaded', () => {
          const native = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
          if (native) Promise.resolve(native('native_desktop_ready', { stage: 'html' })).catch(() => {});
          const root = document.getElementById('root');
          if (!root) return;
          const loaded = new MutationObserver(() => {
            if (!root.querySelector(':scope > .boot') && root.firstElementChild) {
              loaded.disconnect();
              document.title = 'Restora POS - React loaded';
            }
          });
          loaded.observe(root, { childList: true });
          window.setTimeout(async () => {
            if (!root.querySelector(':scope > .boot')) return;
            const script = document.querySelector('script[type="module"][src]');
            let resource = 'No bundled JavaScript module found';
            if (script && script.src) {
              try {
                const response = await fetch(script.src, {
                  cache: 'no-store',
                  signal: AbortSignal.timeout(4000)
                });
                const contentType = response.headers.get('content-type') || 'unknown';
                resource = 'Main module: HTTP ' + response.status + ', content-type: ' + contentType;
              } catch (error) {
                resource = 'Main module fetch failed: ' + String(error).slice(0, 180);
              }
            }
            if (!root.querySelector(':scope > .boot')) return;
            loaded.disconnect();
            document.title = 'Restora POS - Startup failed';
            const panel = document.createElement('main');
            panel.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7f9;color:#161923;font:15px/1.5 system-ui';
            const card = document.createElement('section');
            card.style.cssText = 'max-width:680px;width:100%;background:white;border:1px solid #ddd;border-radius:14px;padding:28px';
            const heading = document.createElement('h1');
            heading.style.cssText = 'font-size:22px;margin:0 0 12px';
            heading.textContent = 'Restora POS could not load';
            const info = document.createElement('p');
            info.textContent = 'The installed desktop interface did not start. Please send these diagnostic details with the issue.';
            const details = document.createElement('pre');
            details.id = 'restora-startup-diagnostics';
            details.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f2f5;border-radius:8px;padding:12px;font-size:12px';
            if (native) {
              Promise.resolve(native('native_desktop_ready', { stage: 'failed', detail: resource })).catch(() => {});
            }
            details.textContent = [
              resource,
              'Page: ' + location.href,
              'Tauri desktop flag: ' + String(window.__RESTORA_DESKTOP__ === true),
              'Online: ' + String(navigator.onLine),
              ...problems.slice(0, 6)
            ].join('\n');
            const retry = document.createElement('button');
            retry.textContent = 'Retry';
            retry.style.cssText = 'background:#4f46e5;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer';
            retry.addEventListener('click', () => location.reload());
            card.append(heading, info, details, retry);
            panel.append(card);
            root.replaceChildren(panel);
          }, 9000);
        }, { once: true });
      })();
    </script>

    <!-- The restaurant's appearance as this device saved it last (utils/apply_appearance), set before anything paints, so a
         dark or themed restaurant never flashes the default colours. -->
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('restora-appearance') || '{}');
        var r = document.documentElement;
        r.dataset.theme = a.theme || 'indigo';
        r.dataset.mode = a.mode === 'dark' || (a.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        r.dataset.sidebar = a.sidebar || 'plain';
      } catch (e) {}
    </script>

    <!-- The boot screen below, shown until the app has downloaded. Colors are the canvas and primary tokens of src/index.css;
         the lid lifts and settles. It fades in late, so a fast load never flashes it. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #F6F7F9; animation: boot-in 300ms 400ms both; }
      [data-mode='dark'] .boot { background: #0B0F19; }
      .boot-lid { transform-box: fill-box; transform-origin: 100% 100%; animation: boot-lid 1.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-lid { 0%, 55%, 100% { transform: none; } 25% { transform: translateY(-2px) rotate(12deg); } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot-lid { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Restora">
        <svg viewBox="0 0 40 40" width="112" height="112" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="#4F46E5" />
          <g fill="#FFFFFF">
            <g class="boot-lid"><circle cx="20" cy="9.5" r="2.5" /><path d="M9 23a11 11 0 0 1 22 0z" /></g>
            <rect x="7" y="25" width="26" height="4" rx="2" />
            <path d="M10.5 28h5L10 32.5z" />
          </g>
        </svg>
      </div>
    </div>
    <noscript>Restora needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
