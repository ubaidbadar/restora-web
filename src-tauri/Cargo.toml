[package]
name = "restora-pos"
version = "0.2.0"
edition = "2024"
description = "Restora POS (bundled React UI and integrated native Windows printing)"
license = "UNLICENSED"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Printing", "Win32_Foundation"] }
webview2-com = "0.39"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
