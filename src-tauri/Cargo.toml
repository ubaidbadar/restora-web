[package]
name = "restora-pos"
version = "0.2.0"
edition = "2024"
description = "Restora POS (bundled React UI and integrated native Windows printing)"
license = "UNLICENSED"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-single-instance = "2"
restora-pc-agent = { git = "https://github.com/ubaidbadar/restora-pc-agent", rev = "51e825a75b3659ab0542e7084c4d798584ab349c", features = ["embedded"] }

[target.'cfg(windows)'.dependencies]
windows = "0.62"
webview2-com = "0.39"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
