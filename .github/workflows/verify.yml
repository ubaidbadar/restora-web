name: Verify Restora Web

on:
  pull_request:
    branches: [main, dev]

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: restora-web-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive

      - name: Verify before browser tests
        run: yarn verify
        env:
          VITE_API_URL: ${{ github.base_ref == 'dev' && 'https://dev.restora.live' || 'https://restora.live' }}
          VITE_APP_URL: ${{ github.base_ref == 'dev' && 'https://dev-app.restora.live' || 'https://app.restora.live' }}

      - name: Share the verified production build with browser tests
        uses: actions/upload-artifact@v4
        with:
          name: restora-web-dist
          path: dist/
          retention-days: 1

  browser-quality:
    name: Playwright UI, journeys and accessibility
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive

      - name: Download the already-verified production build
        uses: actions/download-artifact@v4
        with:
          name: restora-web-dist
          path: dist/

      - name: Install isolated browser test harness
        working-directory: .github/order-page-e2e
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright

      - name: Validate browser test discovery
        working-directory: .github/order-page-e2e
        run: npx playwright test --list --config=playwright.config.cjs

      - name: Install Chromium for the fast PR smoke suite
        working-directory: .github/order-page-e2e
        run: npx playwright install --with-deps chromium

      - name: Run desktop, mouse-laptop, tablet and phone smoke profiles
        working-directory: .github/order-page-e2e
        run: >
          npx playwright test --config=playwright.config.cjs
          --project=chromium-desktop
          --project=chromium-laptop-mouse
          --project=chromium-tablet
          --project=chromium-phone
          --project=chromium-small-phone

      - name: Deploy Firebase preview after all checks pass
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESTORA_LIVE }}
          projectId: restora-live

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-order-browser-smoke
          path: |
            .github/order-page-e2e/test-results
            .github/order-page-e2e/playwright-report
          retention-days: 7
          if-no-files-found: warn
