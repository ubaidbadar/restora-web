name: Verify Restora Web
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn verify
        env:
          VITE_API_URL: https://dev.restora.live
          VITE_APP_URL: https://dev-app.restora.live
