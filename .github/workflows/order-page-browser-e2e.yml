name: New Order full browser matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-order-full-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    name: Full Chromium, Firefox and WebKit matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive

      - name: Build production app
        run: yarn build
        env:
          VITE_API_URL: https://dev.restora.live
          VITE_APP_URL: https://dev-app.restora.live

      - name: Install isolated browser test harness
        working-directory: .github/order-page-e2e
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright

      - name: Validate browser test discovery
        working-directory: .github/order-page-e2e
        run: npx playwright test --list --config=playwright.config.cjs

      - name: Install Chromium, Firefox and WebKit
        working-directory: .github/order-page-e2e
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run all browser and device profiles
        working-directory: .github/order-page-e2e
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-order-full-browser-matrix
          path: |
            .github/order-page-e2e/test-results
            .github/order-page-e2e/playwright-report
          retention-days: 14
          if-no-files-found: warn
