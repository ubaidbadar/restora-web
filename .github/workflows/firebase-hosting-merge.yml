name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - dev
jobs:
  verify:
    name: Release gate — typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Verify before deployment
        run: yarn verify
        env:
          VITE_API_URL: ${{ github.ref_name == 'dev' && 'https://dev.restora.live' || 'https://restora.live' }}
          VITE_APP_URL: ${{ github.ref_name == 'dev' && 'https://dev-app.restora.live' || 'https://app.restora.live' }}

  build_and_deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - name: Install and Build
        run: yarn install --frozen-lockfile --non-interactive && yarn build
        env:
          VITE_API_URL: ${{ github.ref_name == 'dev' && 'https://dev.restora.live' || 'https://restora.live' }}
          VITE_APP_URL: ${{ github.ref_name == 'dev' && 'https://dev-app.restora.live' || 'https://app.restora.live' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESTORA_LIVE }}
          channelId: live
          projectId: restora-live
          target: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
