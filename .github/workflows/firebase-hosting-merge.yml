# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - dev
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and Build
        run: npm install && npm run build
        env:
          VITE_API_URL: ${{ github.ref_name == 'dev' && 'https://dev.restora.live' || 'https://restora.live' }}
          VITE_APP_URL: ${{ github.ref_name == 'dev' && (vars.DEV_APP_URL || 'https://app.restora.live') || 'https://app.restora.live' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESTORA_LIVE }}
          channelId: ${{ github.ref_name == 'dev' && 'dev' || 'live' }}
          projectId: restora-live
