name: Restora Web Tauri 2 Windows

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.ts'
      - '.github/workflows/tauri-windows.yml'
  push:
    branches: [feature/tauri2-integrated-printing-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      VITE_APP_URL: https://app.restora.live
      VITE_API_URL: https://restora.live
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install the existing web dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Validate React and TypeScript
        run: |
          yarn typecheck
          yarn lint
          yarn test
      - name: Build this repository's React assets for native resource tests
        run: yarn build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Resolve native dependencies
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Compile and bundle this repository's React UI
        run: yarn desktop:build
      - name: Confirm native installer
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one Restora installer; found $($setup.Count)" }
          $setup | Select-Object Name, Length
      - name: Smoke test installed Tauri POS with bundled React and printing
        shell: pwsh
        env:
          # CI only. Never enable the debugging port in production releases.
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: '--remote-debugging-port=9222 --remote-allow-origins=*'
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe')[0]
          $installDir = Join-Path $env:RUNNER_TEMP 'restora-pos-smoke'
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS setup failed with exit code $($installer.ExitCode)" }
          $binary = Join-Path $installDir 'restora-pos.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw "Installed Restora POS executable missing: $binary" }
          $assets = Join-Path $installDir 'web/index.html'
          if (-not (Test-Path -LiteralPath $assets)) { throw "Bundled React index.html missing: $assets" }
          $oldAgents = @(Get-Process -Name 'restora-pc-agent' -ErrorAction SilentlyContinue).Count
          $process = Start-Process -FilePath $binary -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Installed Restora POS exited unexpectedly (code $($process.ExitCode))" }
              try {
                $snapshot = Invoke-RestMethod -Uri 'http://127.0.0.1:17777/status' -TimeoutSec 2
                if ($null -ne $snapshot.paired) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'The installed in-process print engine did not start' }
            $blocked = Invoke-WebRequest -Uri 'http://127.0.0.1:17777/setup/pair' -Method Post -ContentType 'application/json' -Body '{"code":"000000"}' -SkipHttpErrorCheck -TimeoutSec 3
            if ($blocked.StatusCode -ne 403) { throw "Originless pairing was not blocked: $($blocked.StatusCode)" }
            $newAgents = @(Get-Process -Name 'restora-pc-agent' -ErrorAction SilentlyContinue).Count
            if ($newAgents -ne $oldAgents) { throw 'A separate print-agent executable was launched' }
            Write-Host 'Installed Restora POS launched with bundled React, in-process printing, and origin guard.'
            node .github/scripts/tauri-window-smoke.mjs "$installDir"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows test installer
        uses: actions/upload-artifact@v5
        with:
          name: restora-web-tauri2-win-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
